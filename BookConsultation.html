<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation</title>
    <link rel="stylesheet" href="BookConsultation.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="booking-container">
        <!-- HEADER -->
        <header class="header">
            <h1>🌿 The Ayur Hub </h1><br />

            <nav>
                <a href="index.html">Home</a>
                <a href="About1.html">About</a>
                <a href="Services1.html">Services</a>
                <a href="Products1.html">Products</a>
                <a href="Contact1.html">Contact</a>
            </nav>
        </header>
        <h1>🌿 Book Your Consultation</h1>

        <form action="Thankyou.html">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preferred Date</label>
                <input type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preferred Time</label>
                <input type="time" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Health Concern</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>

            <button type="submit" class="btn-book">
                Submit Booking
            </button>
        </form>
    </div>
</body>

</html>
