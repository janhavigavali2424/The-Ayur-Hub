<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | The Ayur Hub</title>

    <link rel="stylesheet" href="Contact1.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header class="nav">
    <h2>The Ayur Hub</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="About1.html">About</a>
        <a href="Services1.html">Services</a>
        <a href="Products1.html">Products</a> 
        <a href="Contact1.html">Contact</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <div class="overlay">
        <h1>Contact Us</h1>
        <p>We are here to help you on your wellness journey</p>
    </div>
</section>

<!-- CONTACT SECTION -->
<section class="contact-section">

    <div class="container">

        <div class="row">

            <!-- FORM -->
            <div class="col-md-6">
                <div class="contact-form">

                    <h2>Send Message</h2>

                    <form action="">

                        <input type="text" class="form-control mb-3" placeholder="Your Name">

                        <input type="email" class="form-control mb-3" placeholder="Your Email">

                        <input type="text" class="form-control mb-3" placeholder="Subject">

                        <textarea class="form-control mb-3" rows="5" placeholder="Your Message"></textarea>

                        <button class="btn btn-success w-100">
                            Send Message
                        </button>

                    </form>

                </div>
            </div>

            <!-- INFO -->
            <div class="col-md-6">
                <div class="info-box">

                    <h2>Get in Touch</h2>

                    <p>📍 Ayur Hub Wellness Center, India</p>
                    <p>📞 +91 98765 43210</p>
                    <p>✉ info@ayurhub.com</p>
                    <p>🕒 Mon - Sat: 9 AM - 7 PM</p>

                </div>
            </div>

        </div>

    </div>

</section>

<!-- FOOTER -->
<footer>
    <p>|The Ayur Hub|</p>
</footer>

</body>
</html>
